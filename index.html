<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ORO Cafe</title>
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background-color: #000; color: #fff; direction: rtl; text-align: center; }
        .bg-container { position: relative; width: 100%; max-width: 500px; margin: 0 auto; }
        .btn { position: absolute; background: rgba(0,0,0,0); cursor: pointer; border: none; z-index: 10; }
        .wedding-btn { top: 21%; right: 5%; width: 42%; height: 21%; }
        .birthday-btn { top: 44%; left: 5%; width: 90%; height: 17%; }
        .details-panel { margin: 20px auto; max-width: 450px; padding: 20px; background: #1a1a1a; border: 2px solid #c5a059; border-radius: 15px; display: none; text-align: right; }
        h2 { color: #c5a059; text-align: center; }
    </style>
</head>
<body>
    <div class="bg-container">
        <img src="welcome-bg.jpg.png" style="width:100%">
        <button class="btn wedding-btn" onclick="show('wedding')"></button>
        <button class="btn birthday-btn" onclick="show('birthday')"></button>
    </div>
    <div id="panel" class="details-panel">
        <h2 id="title"></h2>
        <div id="content"></div>
    </div>
    <script>
        function show(type) {
            const panel = document.getElementById('panel');
            const title = document.getElementById('title');
            const content = document.getElementById('content');
            panel.style.display = 'block';
            if(type === 'birthday') {
                title.innerText = "✨ عروض أعياد الميلاد والسبوع ✨";
                content.innerHTML = "• أقل من 5 أفراد: 100 ج خدمة.<br>• من 5 لـ 10 أفراد: 200 ج خدمة.<br>• من 10 لـ 20 فرد: 350 ج خدمة.<br>• 20 فرد فأكثر: 50 ج للفرد + خصم 10% على المنيو.";
            } else {
                title.innerText = "💛 عروض الخطوبة وكتب الكتاب 💛";
                content.innerHTML = "• العرض الأول: 3499 ج.<br>• العرض الثاني: 5500 ج.<br>• العرض الفضي: 6900 ج.<br>• العرض الذهبي: 7880 ج.<br>• عرض الـ VIP: 9280 ج.";
            }
        }
    </script>
</body>
</html>
